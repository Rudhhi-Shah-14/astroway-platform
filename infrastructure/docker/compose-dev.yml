name: astroway-dev

services:
  # Database for Auth & User Service
  postgres-auth:
    image: postgres:16-alpine
    container_name: astroway-auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: astro_user
      POSTGRES_PASSWORD: astro_password
    ports:
      - "5432:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astro_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Database for Astro Catalog & Spots Service
  postgres-catalog:
    image: postgres:16-alpine
    container_name: astroway-catalog-db
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: astro_user
      POSTGRES_PASSWORD: astro_password
    ports:
      - "5433:5432" # Mapped to 5433 on host to avoid port conflict
    volumes:
      - catalog_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astro_user -d catalog_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Cache layer for Sessions, API Caching, and Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: astroway-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Apache Kafka Broker (KRaft Mode - No Zookeeper needed)
  kafka:
    image: apache/kafka:3.8.0
    container_name: astroway-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  auth_db_data:
  catalog_db_data:
  redis_data:
  kafka_data: